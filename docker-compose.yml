version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: cpaa-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    networks:
      - cpaa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpaa-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8000
      - FRONTEND_URL=https://cpaa.ganpatikrsah.site
    networks:
      - cpaa-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpaa-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - cpaa-network
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: cpaa-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cpaa-network

networks:
  cpaa-network:
    driver: bridge
