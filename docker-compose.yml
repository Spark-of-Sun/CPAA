version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpaa-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8000
      - FRONTEND_URL=https://cpaa.ganpatikrsah.site
    networks:
      - cpaa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpaa-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - cpaa-network
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: cpaa-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cpaa-network

  # Cloudflare Tunnel for secure, zero-open-inbound-ports routing
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cpaa-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - cpaa-network
    depends_on:
      - nginx

networks:
  cpaa-network:
    driver: bridge
